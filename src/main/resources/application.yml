server:
  port: ${PORT:8080}

spring:
  application:
    name: JobHarvest
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jobharvest}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  ingestion:
    source-url: ${APP_INGESTION_SOURCE_URL:https://jobicy.com/api/v2/remote-jobs?count=50}
    cooldown-minutes: ${APP_INGESTION_COOLDOWN_MINUTES:60}
    max-retries: ${APP_INGESTION_MAX_RETRIES:3}
    backoff-base-ms: ${APP_INGESTION_BACKOFF_BASE_MS:2000}
    timeout-seconds: ${APP_INGESTION_TIMEOUT_SECONDS:30}
